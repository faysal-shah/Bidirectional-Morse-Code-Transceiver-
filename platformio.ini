; ──────────────────────────────────────────────────────────────────────────────
; MorseLink — PlatformIO project configuration
; https://docs.platformio.org/en/latest/projectconf/index.html
; ──────────────────────────────────────────────────────────────────────────────

[platformio]
; Shared settings for all environments
default_envs = morselink_a

; ──────────────────────────────────────────────────────────────────────────────
; Unit A  (DEVICE_ID = 0)
; ──────────────────────────────────────────────────────────────────────────────
[env:morselink_a]
platform   = espressif32
board      = esp32dev
framework  = arduino

; Source directory = the Arduino sketch folder
src_dir    = firmware/morse_transceiver

build_flags =
    -DDEVICE_ID=0
    -DDEVICE_NAME=\"MorseLink-A\"

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

upload_speed    = 921600

; ──────────────────────────────────────────────────────────────────────────────
; Unit B  (DEVICE_ID = 1) — flash the second device with this env
; ──────────────────────────────────────────────────────────────────────────────
[env:morselink_b]
extends = env:morselink_a

build_flags =
    -DDEVICE_ID=1
    -DDEVICE_NAME=\"MorseLink-B\"
